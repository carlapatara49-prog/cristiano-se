name: Build application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: node -e "require('yaml').parse(require('fs').readFileSync('backend/swagger.yaml','utf8'))"
      - run: npm run build
